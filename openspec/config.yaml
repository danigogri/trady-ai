# openspec/config.yaml — Trady AI
schema: spec-driven

context: |
  Tech stack: Python (planned), SQLite (planned), local-first execution
  Architecture: Deterministic-first financial infrastructure, layered (Governance > Intelligence > Reflection > Core > Adapters > Platforms)
  Testing: No test runner detected — strict_tdd disabled until code exists
  Style: RFC-driven documentation hierarchy (9 levels), deterministic-first philosophy, platform-agnostic, model-agnostic

strict_tdd: false

session:
  execution_mode: interactive
  artifact_store: openspec
  delivery_strategy: ask-always
  review_budget_lines: 400

testing:
  runner: null
  unit: { available: false, tool: null }
  integration: { available: false, tool: null }
  e2e: { available: false, tool: null }
  coverage: { available: false, command: null }
  linter: { available: false, command: null }
  type_checker: { available: false, command: null }
  formatter: { available: false, command: null }

rules:
  proposal:
    - Must reference the RFC that motivates the change
    - Include rollback plan for risky changes
    - State which roadmap phase (0-9) the change belongs to
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Every spec MUST state its deterministic vs intelligence boundary
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Respect the 6-layer separation (Governance > Intelligence > Reflection > Core > Adapters > Platforms)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
