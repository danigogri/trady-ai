# openspec/config.yaml — Trady AI
# Last updated: 2026-07-11 (sdd-init)
schema: spec-driven

context: |
  Tech stack: Python 3.12, pydantic-settings, click, structlog, httpx, sqlite-utils, numpy, websockets
  Architecture: 6-layer (Governance > Intelligence > Reflection > Core > Adapters > Platforms)
  Testing: pytest 199 tests, 91% coverage, mypy strict (0 errors, 29 files), ruff clean
  Style: RFC-driven documentation hierarchy, deterministic-first philosophy, platform-agnostic, model-agnostic
  Entry point: cli/main.py (Click)
  Package: src/trady_ai (hatchling build)

strict_tdd: true

session:
  execution_mode: interactive
  artifact_store: openspec
  delivery_strategy: ask-always
  review_budget_lines: 400

testing:
  runner: pytest
  unit: { available: true, tool: pytest, command: "pytest" }
  integration: { available: true, tool: pytest, command: "pytest" }
  e2e: { available: false, tool: null }
  coverage: { available: true, command: "pytest --cov=trady_ai --cov-report=term-missing", threshold: 90 }
  linter: { available: true, command: "ruff check ." }
  type_checker: { available: true, command: "mypy src/", strict: true }
  formatter: { available: true, command: "ruff format ." }

rules:
  proposal:
    - Must reference the RFC that motivates the change
    - Include rollback plan for risky changes
    - State which roadmap phase (0-9) the change belongs to
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Every spec MUST state its deterministic vs intelligence boundary
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Respect the 6-layer separation (Governance > Intelligence > Reflection > Core > Adapters > Platforms)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "pytest"
  verify:
    test_command: "pytest"
    build_command: "python -m build"
    coverage_threshold: 90
  archive:
    - Warn before merging destructive deltas
