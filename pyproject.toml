[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trady-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.0",
    "click>=8.0",
    "structlog>=24.0",
    "httpx>=0.27",
    "sqlite-utils>=3.36",
    "numpy>=1.26",
]

[project.scripts]
trady-ai = "trady_ai.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trady_ai"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=trady_ai --cov-report=term-missing"
